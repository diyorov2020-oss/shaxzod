<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Табло счёта 🏆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c542;--bg:#070912;--text:#eef1ff;--muted:#8b93b8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(900px 500px at 50% -10%,rgba(245,197,66,.08),transparent 60%),var(--bg);
  color:var(--text);font-family:'Russo One',-apple-system,'Segoe UI',Roboto,sans-serif}
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font:inherit;font-size:15px;color:var(--text)}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
.topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:14px}
.topbar .grp{display:flex;gap:8px}
.home{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px 13px;color:var(--gold);text-decoration:none;font-size:14px}
#board{flex:1;display:flex;gap:2.2vw;padding:0 2.5vw 2.5vh;align-items:stretch}
.team{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;
  background:linear-gradient(160deg,#121833,#0d1226);border:1px solid rgba(255,255,255,.09);
  border-radius:22px;padding:2vh 1vw;min-width:0;transition:border-color .2s, box-shadow .2s}
.team.lead{border-color:var(--gold);box-shadow:0 0 40px rgba(245,197,66,.22)}
.tname{font-size:clamp(15px,2.6vw,30px);text-align:center;outline:none;border-bottom:1px dashed rgba(255,255,255,.25);
  padding:2px 8px;max-width:96%;overflow:hidden;white-space:nowrap;color:var(--text)}
.tname:focus{border-color:var(--gold)}
.crown{height:4.5vh;font-size:4vh;line-height:1}
.score{font-size:clamp(64px,13vw,21vh);line-height:1;font-variant-numeric:tabular-nums;
  text-shadow:0 0 34px rgba(245,197,66,.22)}
.team.lead .score{color:var(--gold)}
.score.pulse{animation:pulse .3s}
@keyframes pulse{50%{transform:scale(1.12)}}
.pm{display:flex;gap:1.2vw}
.pm button{font-size:clamp(20px,3vw,30px);width:clamp(58px,7vw,86px);height:clamp(48px,6vh,64px);border-radius:14px}
.plus{background:linear-gradient(135deg,var(--gold),#d9a520);color:#1a1405}
.minus{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18)}
.key{color:rgba(139,147,184,.65);font-family:system-ui;font-size:12px}
.hintLine{text-align:center;color:rgba(139,147,184,.6);font-family:system-ui;font-size:12.5px;padding-bottom:10px}
@media(max-width:640px){#board{flex-wrap:wrap;overflow:auto}.team{flex:1 1 44%;min-height:38vh}}
</style>
</head>
<body>
<div class="topbar">
  <a class="home" href="pult.html">⌂ ПУЛЬТ</a>
  <div class="grp">
    <button class="btn-ghost" id="btnAdd">＋ команда</button>
    <button class="btn-ghost" id="btnDel">－ команда</button>
    <button class="btn-ghost" id="btnReset" title="Сброс счёта (R)">🔄 сброс</button>
    <button class="btn-ghost" id="btnSnd" title="Звуки">🔊</button>
    <button class="btn-ghost" id="btnFs" title="Весь экран (F)">⛶</button>
  </div>
</div>

<div id="board"></div>
<div class="hintLine">клавиши 1–4 = +1 очко • Shift + 1–4 = −1 • имя команды — кликни и впиши • R — сброс • F — весь экран</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let teams=[{name:'КОМАНДА 1',score:0},{name:'КОМАНДА 2',score:0}];
let sndOn=true;

let audioCtx=null;
function beep(f,d,type,g){
  if(!sndOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=f;
    gn.gain.setValueAtTime(g||0.15,audioCtx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);
    o.connect(gn);gn.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d+0.02);
  }catch(e){}
}

function leaders(){
  const mx=Math.max(...teams.map(t=>t.score));
  return mx>0?teams.map(t=>t.score===mx):teams.map(()=>false);
}
function render(){
  const lead=leaders();
  $('board').innerHTML=teams.map((t,i)=>
    '<div class="team'+(lead[i]?' lead':'')+'" data-i="'+i+'">'+
      '<div class="crown">'+(lead[i]?'👑':'')+'</div>'+
      '<div class="tname" contenteditable="true" spellcheck="false" data-i="'+i+'">'+escapeHtml(t.name)+'</div>'+
      '<div class="score" id="sc'+i+'">'+t.score+'</div>'+
      '<div class="pm">'+
        '<button class="minus" data-i="'+i+'" data-d="-1">−</button>'+
        '<button class="plus" data-i="'+i+'" data-d="1">＋</button>'+
      '</div>'+
      '<div class="key">клавиша '+(i+1)+'</div>'+
    '</div>'
  ).join('');
}
function escapeHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function change(i,d){
  if(i<0||i>=teams.length)return;
  teams[i].score=Math.max(0,teams[i].score+d);
  render();
  const el=$('sc'+i);
  if(el){el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),320);}
  beep(d>0?740:220,.1,d>0?'triangle':'sine',.18);
}

$('board').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  change(+b.dataset.i,+b.dataset.d);
});
$('board').addEventListener('blur',e=>{
  const n=e.target.closest('.tname');if(!n)return;
  const i=+n.dataset.i;
  teams[i].name=(n.textContent.trim()||('КОМАНДА '+(i+1))).slice(0,20);
  render();
},true);
$('board').addEventListener('keydown',e=>{
  if(e.target.closest('.tname')&&e.key==='Enter'){e.preventDefault();e.target.blur();}
});

$('btnAdd').onclick=()=>{if(teams.length<4){teams.push({name:'КОМАНДА '+(teams.length+1),score:0});render();}};
$('btnDel').onclick=()=>{if(teams.length>2){teams.pop();render();}};
$('btnReset').onclick=()=>{if(confirm('Обнулить счёт всех команд?')){teams.forEach(t=>t.score=0);render();}};
$('btnSnd').onclick=()=>{sndOn=!sndOn;$('btnSnd').textContent=sndOn?'🔊':'🔇';};
$('btnFs').onclick=toggleFs;
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});}

addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('.tname'))return; // не мешаем редактировать имя
  const codes=['Digit1','Digit2','Digit3','Digit4'];
  const i=codes.indexOf(e.code);
  if(i>-1&&i<teams.length){e.preventDefault();change(i,e.shiftKey?-1:1);}
  if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К')$('btnReset').click();
  if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')toggleFs();
});
render();
</script>
</body>
</html>
