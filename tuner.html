<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F0F12">
<title>REZONANS</title>
<style>
  :root{
    --bg:#0F0F12; --surf:#1B1B21; --surf2:#282830; --line:rgba(255,255,255,.09);
    --txt:#F3F3F6; --mut:#8C8C97;
    --acc:#16C0E6; --accInk:#04222B;
    --good:#33D07A; --warn:#F5A623; --bad:#FF5252;
    --mono: ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans: "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--txt);font-family:var(--sans);
    min-height:100dvh;display:flex;justify-content:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
  .app{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px}

  /* ---- ШАПКА ---- */
  header{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand b{font-size:20px;font-weight:700;letter-spacing:.30em;color:var(--acc)}
  .brand div{font-size:9px;letter-spacing:.34em;color:var(--mut);margin-top:2px}
  .htools{display:flex;gap:8px;align-items:center}
  .lang{display:flex;border:1px solid var(--line)}
  .lang button{border:none;background:transparent;color:var(--mut);font-family:var(--mono);
    font-size:12px;font-weight:700;padding:7px 10px;cursor:pointer}
  .lang button.on{background:var(--acc);color:var(--accInk)}
  .sq{width:38px;height:34px;border:1px solid var(--line);background:var(--surf);color:var(--txt);
    font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .sq.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}

  /* ---- A4 ---- */
  .a4row{display:flex;align-items:stretch;gap:6px}
  .a4lbl{display:flex;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--mut);padding-right:4px}
  .a4presets{display:flex;flex:1;gap:6px}
  .a4presets button{flex:1;border:1px solid var(--line);background:var(--surf);color:var(--txt);
    font-family:var(--mono);font-size:14px;font-weight:700;padding:9px 0;cursor:pointer}
  .a4presets button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
  .a4fine{display:flex;gap:6px}
  .a4fine button{width:38px;border:1px solid var(--line);background:var(--surf);color:var(--txt);font-size:18px;cursor:pointer}
  .a4val{min-width:52px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:var(--acc);border:1px solid var(--line);background:var(--surf)}

  /* ---- ШКАЛА ---- */
  .dial{position:relative;background:var(--surf);border:1px solid var(--line);padding:8px 8px 0;transition:box-shadow .18s,border-color .18s}
  .dial.locked{border-color:var(--good);box-shadow:inset 0 0 0 2px var(--good),0 0 34px rgba(51,208,122,.30)}
  .flash{position:absolute;inset:0;background:var(--good);opacity:0;pointer-events:none;z-index:1}
  .flash.go{animation:flash .55s ease-out}
  @keyframes flash{0%{opacity:.30}100%{opacity:0}}
  .lock{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;
    font-family:var(--mono);font-size:11px;letter-spacing:.3em;padding:5px 14px;color:var(--mut);
    border:1px solid var(--line);background:var(--bg)}
  .lock.on{color:var(--accInk);background:var(--good);border-color:var(--good)}
  .gauge{width:100%;display:block}
  .needle{transition:transform .07s linear;transform-origin:220px 215px}

  .readout{position:absolute;left:0;right:0;top:48%;text-align:center;pointer-events:none;z-index:2}
  .note{font-weight:700;line-height:.86;font-size:112px;letter-spacing:-.03em;transition:color .12s}
  .note.good{color:var(--good)}
  .note.pop{animation:pop .4s ease-out}
  @keyframes pop{0%{transform:scale(1)}32%{transform:scale(1.09)}100%{transform:scale(1)}}
  .note.idle{font-size:40px;color:var(--mut);font-weight:400}
  .note sup{font-size:.30em;font-weight:600;opacity:.55;vertical-align:super;margin-left:3px}
  .solf{font-family:var(--mono);font-size:13px;letter-spacing:.34em;color:var(--mut);margin-top:4px;min-height:16px}

  .metrics{display:flex;justify-content:center;gap:38px;margin:6px 0 4px;font-family:var(--mono)}
  .metric{text-align:center}
  .metric .v{font-size:22px;font-weight:700}
  .metric .k{font-size:9px;letter-spacing:.22em;color:var(--mut);margin-top:2px}
  .guide{height:22px;text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--mut)}
  .guide.up{color:var(--acc)} .guide.down{color:var(--warn)} .guide.lock{color:var(--good)}
  .spectrum{width:100%;height:46px;display:block;background:var(--bg);margin-top:2px}

  /* ---- ПЛИТКИ ---- */
  .pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pills::-webkit-scrollbar{display:none}
  .pill{white-space:nowrap;padding:11px 16px;border:1px solid var(--line);background:var(--surf);
    color:var(--mut);font-size:14px;font-weight:600;cursor:pointer}
  .pill.sel{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
  .pill.custom{border-style:dashed}
  .pill .del{margin-left:8px;color:var(--bad);font-weight:800}

  .strings{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .str{position:relative;padding:10px 6px;border:1px solid var(--line);background:var(--surf);text-align:center;cursor:pointer}
  .str .n{font-weight:700;font-size:18px}
  .str .o{font-family:var(--mono);font-size:10px;color:var(--mut);margin-top:1px}
  .str.active{border-color:var(--acc);background:var(--surf2)}
  .str.tuned{border-color:var(--good);background:rgba(51,208,122,.14)}
  .str.ringing{border-color:var(--warn)}
  .str .x{position:absolute;top:0;right:0;width:20px;height:20px;background:var(--bad);color:#2a0b0b;
    border:none;font-size:13px;line-height:20px;cursor:pointer;display:none}
  .str.editable:hover .x,.str.editable:focus-within .x{display:block}
  .str.add{display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--mut);border-style:dashed}
  .str.add select{position:absolute;inset:0;opacity:0;cursor:pointer}

  .savebtn{width:100%;padding:12px;border:1px solid var(--line);background:var(--surf);color:var(--txt);
    font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer}
  .savebtn:active{background:var(--surf2)}
  .savebtn[disabled]{opacity:.4;cursor:default}

  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    padding:12px;border:1px solid var(--line);background:var(--surf)}
  .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mut)}
  .field{display:flex;align-items:center;gap:8px}
  select.dsel{border:1px solid var(--line);background:var(--bg);color:var(--txt);padding:9px 10px;
    font-size:14px;font-family:var(--mono);cursor:pointer}
  .dbtn{width:44px;height:40px;border:1px solid var(--line);background:var(--surf2);color:var(--txt);font-size:15px;cursor:pointer}
  .dbtn.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
  input[type=range]{accent-color:var(--acc);width:88px}

  .mic{width:100%;padding:17px;border:none;cursor:pointer;font-size:16px;font-weight:700;letter-spacing:.04em;
    background:var(--acc);color:var(--accInk)}
  .mic:active{filter:brightness(.94)}
  .mic.live{background:var(--bad);color:#fff}
  .hint{text-align:center;font-size:12px;color:var(--mut);min-height:16px;line-height:1.45}
  a.credit{color:var(--mut);font-size:10px;text-align:center;text-decoration:none;letter-spacing:.24em;opacity:.7}

  /* ---- РЕЖИМ СЦЕНА ---- */
  body.stage .app{max-width:none}
  body.stage header, body.stage .a4row, body.stage .pills, body.stage .strings,
  body.stage .savebtn, body.stage .tools, body.stage .hint, body.stage .credit, body.stage .spectrum{display:none}
  body.stage .note{font-size:min(46vw,300px)}
  body.stage .dial{border:none;background:transparent}
  body.stage .metrics .v{font-size:30px}
  .stagebtn{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:30;display:none}
  body.stage .stagebtn{display:flex}

  @media (max-width:430px){ .note{font-size:92px} .metrics{gap:26px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
  :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<button class="sq stagebtn" id="stageExit" aria-label="exit">⤢</button>
<div class="app">

  <header>
    <div class="brand"><b>REZONANS</b><div id="tagline">SOZLAGICH</div></div>
    <div class="htools">
      <button class="sq" id="vibro" title="vibro" aria-label="vibro">〜</button>
      <button class="sq" id="stageBtn" title="stage" aria-label="stage">⤢</button>
      <div class="lang" id="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div>
    </div>
  </header>

  <div class="a4row">
    <span class="a4lbl">A4</span>
    <div class="a4presets" id="a4presets"></div>
    <div class="a4fine">
      <button id="a4dn" aria-label="−">−</button>
      <div class="a4val" id="a4v">440</div>
      <button id="a4up" aria-label="+">+</button>
    </div>
  </div>

  <section class="dial" id="dial">
    <div class="flash" id="flash"></div>
    <div class="lock" id="lock">SOZLANDI</div>
    <svg class="gauge" viewBox="0 0 440 250" aria-hidden="true">
      <path d="M35 215 A185 185 0 0 1 405 215" fill="none" stroke="#2b2b33" stroke-width="10"/>
      <path id="zone" fill="none" stroke="#33D07A" stroke-width="10" stroke-linecap="butt"/>
      <g id="ticks"></g>
      <line class="needle" id="needle" x1="220" y1="215" x2="220" y2="26" stroke="#8C8C97" stroke-width="6" stroke-linecap="butt"/>
      <rect x="210" y="205" width="20" height="20" fill="#0F0F12" stroke="#8C8C97" stroke-width="2"/>
    </svg>
    <div class="readout">
      <div class="note idle" id="note">—</div>
      <div class="solf" id="solf"></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="v" id="cents">0</div><div class="k" id="centsLbl">SENT</div></div>
      <div class="metric"><div class="v" id="hz">0.0</div><div class="k">HZ</div></div>
    </div>
    <div class="guide" id="guide"></div>
    <canvas class="spectrum" id="spec" width="1040" height="92" style="height:46px"></canvas>
  </section>

  <div class="pills" id="pills"></div>
  <div class="strings" id="strings"></div>
  <button class="savebtn" id="saveTuning"></button>

  <div class="tools">
    <div class="field"><span class="lbl" id="droneLbl">DRON</span>
      <select class="dsel" id="dronesel" aria-label="drone"></select>
      <button class="dbtn" id="droneBtn" aria-label="play">▶</button></div>
    <div class="field"><span class="lbl" id="volLbl">OVOZ</span><input type="range" id="dronevol" min="0" max="100" value="28"></div>
  </div>

  <button class="mic" id="mic"></button>
  <div class="hint" id="hint"></div>
  <a class="credit" href="https://diyorov2020-oss.github.io/shaxzod/" target="_blank" rel="noopener">DIYOROV PRODUCTION</a>
</div>

<script>
"use strict";
/* ================= ЯЗЫКИ ================= */
const I18N={
  uz:{tag:"SOZLAGICH",cents:"SENT",lock:"SOZLANDI",drone:"DRON",vol:"OVOZ",
    micStart:"Mikrofonni yoqish",micStop:"Toʻxtat",listen:"Tinglayapman… bitta torni chal.",
    denied:"Mikrofon mavjud emas. Brauzer ruxsatini tekshir.",
    offline:"Oflayn ishlaydi. Mikrofonga ruxsat ber va bitta ochiq torni chal. Torga tegsang — ovozi chalinadi.",
    wait:"signal kutilyapti",stopped:"toʻxtatildi",inTune:"✓ sozlandi",up:"▲ tortib koʻtar",down:"▼ boʻshatib tushir",
    save:"＋ Bu sozlashni saqlash",saveNo:"Saqlash uchun tor qoʻsh",promptName:"Sozlash nomi:",defName:"Mening sozlashim",
    hKanun:"Qonun/maqom: mikrotonlar mandallar bilan. «DRON»ga tayanch nota qoʻyib, gʻuvillash ostida quloq bilan sozla.",
    hPreset:n=>"«"+n+"» sozlash. ＋ qoʻsh, × oʻchir, torga teg — ovozini chal.",
    hChrom:"Xromatik: eng yaqin notani koʻrsatadi.",hCustom:n=>"«"+n+"» sozlashim. Torga teg — ovozini chal."},
  ru:{tag:"ТЮНЕР",cents:"ЦЕНТЫ",lock:"В СТРОЮ",drone:"ДРОН",vol:"ГРОМК.",
    micStart:"Включить микрофон",micStop:"Стоп",listen:"Слушаю… играй по одной струне.",
    denied:"Микрофон недоступен. Проверь разрешение браузера.",
    offline:"Работает офлайн. Разреши микрофон и играй по одной открытой струне. Тап по струне — сыграть тон.",
    wait:"жди сигнал",stopped:"остановлено",inTune:"✓ в строю",up:"▲ подтяни выше",down:"▼ ослабь ниже",
    save:"＋ Сохранить этот строй как свой",saveNo:"Добавь струны, чтобы сохранить",promptName:"Название строя:",defName:"Мой строй",
    hKanun:"Канун/маком: микротоны — мандалами. Возьми опорную ноту в «ДРОН» и строй на слух под гул.",
    hPreset:n=>"Строй «"+n+"». ＋ добавить, × убрать, тап по струне — сыграть тон.",
    hChrom:"Хроматика: показывает любую ближайшую ноту.",hCustom:n=>"Мой строй «"+n+"». Тап по струне — сыграть тон."}
};
let lang=(function(){try{return localStorage.getItem("rezonans_lang")||"uz";}catch(e){return "uz";}})();
const t=k=>I18N[lang][k];

/* ================= МУЗ. МАТЕМАТИКА ================= */
const NOTE_NAMES=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const SOLF={
  ru:{C:"До","C#":"До♯",D:"Ре","D#":"Ре♯",E:"Ми",F:"Фа","F#":"Фа♯",G:"Соль","G#":"Соль♯",A:"Ля","A#":"Ля♯",B:"Си"},
  uz:{C:"Do","C#":"Do♯",D:"Re","D#":"Re♯",E:"Mi",F:"Fa","F#":"Fa♯",G:"Sol","G#":"Sol♯",A:"La","A#":"La♯",B:"Si"}
};
let A4=440;
function freqToData(freq){ const mf=69+12*Math.log2(freq/A4), midi=Math.round(mf);
  return {name:NOTE_NAMES[((midi%12)+12)%12], octave:Math.floor(midi/12)-1, cents:Math.round((mf-midi)*100), midi, freq}; }
function nameToMidi(str){ const m=/^([A-Ga-g])([#b]?)(-?\d+)$/.exec(str.trim()); if(!m) return null;
  const base={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1].toUpperCase()];
  return base+(m[2]==="#"?1:m[2]==="b"?-1:0)+(parseInt(m[3],10)+1)*12; }
function midiToFreq(midi){ return A4*Math.pow(2,(midi-69)/12); }

/* ================= MPM ================= */
function detectPitch(buf,sr){ const n=buf.length; let rms=0;
  for(let i=0;i<n;i++) rms+=buf[i]*buf[i]; rms=Math.sqrt(rms/n);
  if(rms<0.008) return {freq:-1,clarity:0,rms};
  const maxLag=Math.min(n>>1,Math.floor(sr/28)); const nsdf=new Float32Array(maxLag);
  for(let tau=0;tau<maxLag;tau++){ let ac=0,m=0;
    for(let j=0;j<n-tau;j++){ const a=buf[j],b=buf[j+tau]; ac+=a*b; m+=a*a+b*b; }
    nsdf[tau]= m>0? 2*ac/m : 0; }
  const maxima=[]; let pos=false,cmT=-1,cmV=-1;
  for(let x=1;x<maxLag;x++){
    if(nsdf[x]>0&&nsdf[x-1]<=0){pos=true;cmT=x;cmV=nsdf[x];}
    else if(nsdf[x]<=0&&nsdf[x-1]>0){ if(pos&&cmT>0) maxima.push({tau:cmT,val:cmV}); pos=false; }
    else if(pos&&nsdf[x]>cmV){cmT=x;cmV=nsdf[x];} }
  if(pos&&cmT>0) maxima.push({tau:cmT,val:cmV});
  if(!maxima.length) return {freq:-1,clarity:0,rms};
  let gMax=0; for(const mx of maxima) if(mx.val>gMax) gMax=mx.val;
  const thresh=0.9*gMax; let chosen=maxima[0];
  for(const mx of maxima){ if(mx.val>=thresh){chosen=mx;break;} }
  let T=chosen.tau; if(T>0&&T<maxLag-1){ const x1=nsdf[T-1],x2=nsdf[T],x3=nsdf[T+1];
    const a=(x1+x3-2*x2)/2,b=(x3-x1)/2; if(a) T=T-b/(2*a); }
  return {freq:sr/T, clarity:chosen.val, rms};
}

/* ================= ИНСТРУМЕНТЫ ================= */
const INSTRUMENTS=[
  {id:"chrom",nm:{uz:"Xromatik",ru:"Хроматик"},notes:[]},
  {id:"guitar",nm:{uz:"Gitara",ru:"Гитара"},notes:["E2","A2","D3","G3","B3","E4"]},
  {id:"bass",nm:{uz:"Bas",ru:"Бас"},notes:["B0","E1","A1","D2","G2"]},
  {id:"uku",nm:{uz:"Ukulele",ru:"Укулеле"},notes:["G4","C4","E4","A4"]},
  {id:"violin",nm:{uz:"Skripka",ru:"Скрипка"},notes:["G3","D4","A4","E5"]},
  {id:"cello",nm:{uz:"Violonchel",ru:"Виолончель"},notes:["C2","G2","D3","A3"]},
  {id:"saz",nm:{uz:"Soz",ru:"Саз"},notes:["A2","D3","G3"]},
  {id:"dutar",nm:{uz:"Dutor",ru:"Дутор"},notes:["E3","A3"]},
  {id:"tanbur",nm:{uz:"Tanbur",ru:"Танбур"},notes:["D3","G3","D4"]},
  {id:"rubab",nm:{uz:"Rubob",ru:"Рубоб"},notes:["C3","G3","C4"]},
  {id:"dombra",nm:{uz:"Dumbra",ru:"Домбра"},notes:["D3","G3"]},
  {id:"oud",nm:{uz:"Ud",ru:"Уд"},notes:["C2","F2","A2","D3","G3","C4"]},
  {id:"kanun",nm:{uz:"Qonun",ru:"Канун"},notes:[]},
];
let targets=[], curId="chrom";
const LSKEY="rezonans_custom_v1";
let customTunings=loadCustom();

/* ================= ХРАНИЛИЩЕ ================= */
function storageOk(){ try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true;}catch(e){return false;} }
function loadCustom(){ try{return JSON.parse(localStorage.getItem(LSKEY)||"[]");}catch(e){return [];} }
function persistCustom(){ try{localStorage.setItem(LSKEY,JSON.stringify(customTunings));}catch(e){} }

/* ================= UI ================= */
const $=id=>document.getElementById(id);
const pillsEl=$("pills"), stringsEl=$("strings");
function escapeHtml(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function buildPills(){
  pillsEl.innerHTML="";
  INSTRUMENTS.forEach(inst=>{ const b=document.createElement("button");
    b.className="pill"; b.textContent=inst.nm[lang]; b.dataset.id=inst.id;
    b.onclick=()=>selectBuiltin(inst.id); pillsEl.appendChild(b); });
  customTunings.forEach((tn,idx)=>{ const b=document.createElement("button");
    b.className="pill custom"; b.dataset.id="custom:"+idx;
    b.innerHTML=escapeHtml(tn.name)+'<span class="del">×</span>';
    b.onclick=e=>{ if(e.target.classList.contains("del")){ e.stopPropagation();
        customTunings.splice(idx,1); persistCustom(); buildPills();
        if(curId==="custom:"+idx) selectBuiltin("chrom"); return; }
      selectCustom(idx); };
    pillsEl.appendChild(b); });
  markSelected();
}
function markSelected(){ document.querySelectorAll(".pill").forEach(p=>p.classList.toggle("sel",p.dataset.id===curId)); }
function applyTargets(midis,id,hint){ curId=id; targets=midis.map(m=>({midi:m}));
  markSelected(); renderStrings(); updateSaveBtn(); if(hint!==undefined) setHint(hint); }
function selectBuiltin(id){ const inst=INSTRUMENTS.find(i=>i.id===id); const midis=inst.notes.map(nameToMidi);
  const hint=id==="kanun"?t("hKanun"):inst.notes.length?t("hPreset")(inst.nm[lang]):t("hChrom");
  applyTargets(midis,id,hint); }
function selectCustom(idx){ const tn=customTunings[idx]; applyTargets(tn.midis.slice(),"custom:"+idx,t("hCustom")(tn.name)); }

function renderStrings(){
  stringsEl.innerHTML="";
  targets.forEach((tg,idx)=>{ tg.freq=midiToFreq(tg.midi); const d=freqToData(tg.freq);
    const el=document.createElement("div"); el.className="str editable"; el.tabIndex=0;
    el.innerHTML='<div class="n">'+d.name+'</div><div class="o">'+d.octave+' · '+tg.freq.toFixed(1)+'</div><button class="x">×</button>';
    el.querySelector(".x").onclick=e=>{ e.stopPropagation(); targets.splice(idx,1); renderStrings(); updateSaveBtn(); };
    el.onclick=e=>{ if(e.target.classList.contains("x")) return; toggleDroneFromChip(tg.midi); };
    tg.el=el; stringsEl.appendChild(el); });
  const add=document.createElement("label"); add.className="str add"; add.textContent="＋";
  const sel=document.createElement("select"); sel.innerHTML=noteOptions(23,88); sel.value="55";
  sel.onchange=()=>{ targets.push({midi:parseInt(sel.value,10)}); renderStrings(); updateSaveBtn(); };
  add.appendChild(sel); stringsEl.appendChild(add);
}
function noteOptions(lo,hi){ let h=""; for(let m=lo;m<=hi;m++){ const d=freqToData(midiToFreq(m)); h+='<option value="'+m+'">'+d.name+d.octave+'</option>'; } return h; }

function updateSaveBtn(){ const btn=$("saveTuning"); const ok=storageOk()&&targets.length>0;
  btn.disabled=!ok; btn.textContent=targets.length?t("save"):t("saveNo"); }
$("saveTuning").onclick=()=>{ if(!targets.length) return;
  const name=(prompt(t("promptName"),t("defName"))||"").trim(); if(!name) return;
  customTunings.push({name,midis:targets.map(x=>x.midi)}); persistCustom(); buildPills(); selectCustom(customTunings.length-1); };

/* тики + зелёная зона строя */
(function(){ const g=$("ticks"), cx=220, cy=215, r=185;
  [-50,-25,-10,10,25,50].forEach(c=>{ const ang=(c/50)*(Math.PI/2);
    const r2=r-16;
    const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
    ln.setAttribute("x1",cx+r*Math.sin(ang)); ln.setAttribute("y1",cy-r*Math.cos(ang));
    ln.setAttribute("x2",cx+r2*Math.sin(ang)); ln.setAttribute("y2",cy-r2*Math.cos(ang));
    ln.setAttribute("stroke","rgba(255,255,255,.28)"); ln.setAttribute("stroke-width","2"); g.appendChild(ln); });
  const a=(9/50)*(Math.PI/2); // ±5..~9°? зона ±5c -> угол 9°
  const z5=(5/50)*(Math.PI/2);
  const p1x=cx+r*Math.sin(-z5), p1y=cy-r*Math.cos(-z5), p2x=cx+r*Math.sin(z5), p2y=cy-r*Math.cos(z5);
  $("zone").setAttribute("d","M"+p1x+" "+p1y+" A"+r+" "+r+" 0 0 1 "+p2x+" "+p2y);
})();

/* ================= A4 ================= */
const A4_PRESETS=[432,440,442];
function buildA4presets(){ const w=$("a4presets"); w.innerHTML="";
  A4_PRESETS.forEach(v=>{ const b=document.createElement("button"); b.textContent=v; b.dataset.v=v;
    b.onclick=()=>setA4(v); w.appendChild(b); }); }
function setA4(v){ A4=Math.max(415,Math.min(466,Math.round(v))); $("a4v").textContent=A4;
  document.querySelectorAll("#a4presets button").forEach(b=>b.classList.toggle("on",+b.dataset.v===A4));
  if(targets.length) renderStrings();
  if(drone.osc) drone.osc.frequency.setValueAtTime(midiToFreq(drone.midi),audioCtx.currentTime); }
$("a4up").onclick=()=>setA4(A4+1); $("a4dn").onclick=()=>setA4(A4-1);
function setHint(x){ $("hint").textContent=x; }

/* ================= ЯЗЫК ================= */
function applyLang(){ document.documentElement.lang=lang;
  $("tagline").textContent=t("tag"); $("centsLbl").textContent=t("cents");
  $("droneLbl").textContent=t("drone"); $("volLbl").textContent=t("vol"); $("lock").textContent=t("lock");
  $("mic").textContent=running?t("micStop"):t("micStart");
  document.querySelectorAll("#lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  buildPills();
  if(curId.startsWith("custom:")) selectCustom(parseInt(curId.split(":")[1],10)); else selectBuiltin(curId);
  if(!running) $("solf").textContent="";
  try{localStorage.setItem("rezonans_lang",lang);}catch(e){}
}
$("lang").querySelectorAll("button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;applyLang();});

/* ================= УДОБСТВА ================= */
// вибро при попадании в строй
let hapticsOn=(function(){try{return localStorage.getItem("rezonans_haptics")!=="0";}catch(e){return true;}})();
function applyHapticsUI(){ $("vibro").classList.toggle("on",hapticsOn); }
$("vibro").onclick=()=>{ hapticsOn=!hapticsOn; applyHapticsUI(); try{localStorage.setItem("rezonans_haptics",hapticsOn?"1":"0");}catch(e){} };
// режим сцена
function setStage(on){ document.body.classList.toggle("stage",on);
  if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(()=>{});
  if(!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }
$("stageBtn").onclick=()=>setStage(true);
$("stageExit").onclick=()=>setStage(false);
// экран не гаснет
let wakeLock=null;
async function requestWake(){ try{ if("wakeLock" in navigator) wakeLock=await navigator.wakeLock.request("screen"); }catch(e){} }
function releaseWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&running) requestWake(); });

/* ================= АУДИО ================= */
let audioCtx=null, analyser=null, micStream=null, micSource=null, timeBuf=null, freqBuf=null;
let running=false, rafId=null, lastDetect=0, lastGood=0;
const specCanvas=$("spec"), sctx=specCanvas.getContext("2d");
function ensureCtx(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume(); return audioCtx; }
function maybeIdle(){ if(!running&&!drone.osc&&audioCtx&&audioCtx.state==="running") audioCtx.suspend(); }

/* Дрон */
let drone={osc:null,gain:null,midi:null}; let droneVol=0.28;
function playDrone(midi){ const ctx=ensureCtx(); stopDrone(true);
  const osc=ctx.createOscillator(); osc.type="triangle"; osc.frequency.value=midiToFreq(midi);
  const g=ctx.createGain(); g.gain.value=0; osc.connect(g).connect(ctx.destination); osc.start();
  g.gain.linearRampToValueAtTime(droneVol,ctx.currentTime+0.05); drone={osc,gain:g,midi}; updateDroneUI(); }
function stopDrone(silent){ if(drone.osc){ try{ const ctx=audioCtx,o=drone.osc,g=drone.gain;
    g.gain.cancelScheduledValues(ctx.currentTime); g.gain.linearRampToValueAtTime(0,ctx.currentTime+0.06);
    setTimeout(()=>{try{o.stop();o.disconnect();g.disconnect();}catch(e){} maybeIdle();},90);}catch(e){} }
  drone={osc:null,gain:null,midi:null}; if(!silent) updateDroneUI(); }
function updateDroneUI(){ const on=!!drone.osc; $("droneBtn").classList.toggle("on",on); $("droneBtn").textContent=on?"⏹":"▶";
  document.querySelectorAll(".str").forEach(s=>s.classList.remove("ringing"));
  if(on) targets.forEach(tg=>{ if(tg.midi===drone.midi&&tg.el) tg.el.classList.add("ringing"); }); }
function toggleDroneFromChip(midi){ if(drone.osc&&drone.midi===midi) stopDrone(); else { $("dronesel").value=String(midi); playDrone(midi); } }
$("droneBtn").onclick=()=>{ if(drone.osc) stopDrone(); else playDrone(parseInt($("dronesel").value,10)); };
$("dronesel").onchange=()=>{ if(drone.osc) playDrone(parseInt($("dronesel").value,10)); };
$("dronevol").oninput=e=>{ droneVol=e.target.value/100; if(drone.gain) drone.gain.gain.setTargetAtTime(droneVol,audioCtx.currentTime,.02); };

/* Микрофон */
const hist=[];
function smoothFreq(f){ hist.push(f); if(hist.length>5) hist.shift(); const s=[...hist].sort((a,b)=>a-b); return s[Math.floor(s.length/2)]; }
async function startMic(){
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}); }
  catch(e){ setHint(t("denied")); return; }
  const ctx=ensureCtx(); analyser=ctx.createAnalyser(); analyser.fftSize=8192; analyser.smoothingTimeConstant=0.7;
  timeBuf=new Float32Array(analyser.fftSize); freqBuf=new Uint8Array(analyser.frequencyBinCount);
  micSource=ctx.createMediaStreamSource(micStream); micSource.connect(analyser);
  running=true; $("mic").textContent=t("micStop"); $("mic").classList.add("live"); setHint(t("listen"));
  requestWake(); loop();
}
function stopMic(){ running=false; if(rafId) cancelAnimationFrame(rafId);
  if(micSource){try{micSource.disconnect();}catch(e){} micSource=null;}
  if(micStream){micStream.getTracks().forEach(x=>x.stop()); micStream=null;}
  analyser=null; hist.length=0; releaseWake();
  $("mic").textContent=t("micStart"); $("mic").classList.remove("live");
  showIdle(); $("solf").textContent=t("stopped"); $("cents").textContent="0"; $("hz").textContent="0.0"; $("guide").textContent="";
  setNeedle(0,"mut"); $("lock").classList.remove("on"); $("dial").classList.remove("locked");
  $("note").classList.remove("good","pop"); confirmed=false; lockHoldStart=0;
  document.querySelectorAll(".str").forEach(s=>s.classList.remove("active","tuned"));
  sctx.clearRect(0,0,specCanvas.width,specCanvas.height); maybeIdle();
}
$("mic").onclick=()=>running?stopMic():startMic();

/* ОТРИСОВКА */
function showIdle(){ const n=$("note"); n.classList.add("idle"); n.innerHTML="—"; }
function setNeedle(cents,state){ const c=Math.max(-50,Math.min(50,cents));
  $("needle").style.transform="rotate("+(c/50*90)+"deg)";
  const col=state==="good"?"#33D07A":state==="warn"?"#F5A623":state==="bad"?"#FF5252":"#8C8C97";
  $("needle").setAttribute("stroke",col); }
function drawSpectrum(){ const W=specCanvas.width,H=specCanvas.height; sctx.clearRect(0,0,W,H);
  const bars=64, step=Math.floor(freqBuf.length/2/bars), bw=W/bars;
  sctx.fillStyle="#16C0E6";
  for(let i=0;i<bars;i++){ let v=0; for(let j=0;j<step;j++) v=Math.max(v,freqBuf[i*step+j]);
    const h=(v/255)*H; sctx.fillRect(i*bw+1,H-h,bw-2,h); } }
let lockOn=false, lockHoldStart=0, confirmed=false;
function chime(){ if(!hapticsOn) return; try{ const ctx=ensureCtx(), t0=ctx.currentTime;
  [[880,0],[1318.5,0.09]].forEach(([f,dt])=>{ const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=f; o.connect(g).connect(ctx.destination);
    g.gain.setValueAtTime(0.0001,t0+dt); g.gain.exponentialRampToValueAtTime(0.22,t0+dt+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+0.28); o.start(t0+dt); o.stop(t0+dt+0.30); }); }catch(e){} }
function doConfirm(){ confirmed=true; $("dial").classList.add("locked");
  const f=$("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const n=$("note"); n.classList.remove("pop"); void n.offsetWidth; n.classList.add("pop");
  if(hapticsOn&&navigator.vibrate) navigator.vibrate(35); chime(); }
function undoConfirm(){ confirmed=false; $("dial").classList.remove("locked"); $("note").classList.remove("good","pop"); }
function updateDisplay(freq,rms){ lastGood=performance.now();
  const d=freqToData(freq);
  if(Math.abs(d.cents)<=5) lockOn=true; else if(Math.abs(d.cents)>9) lockOn=false;
  const state=lockOn?"good":Math.abs(d.cents)<=20?"warn":"bad";
  const n=$("note"); n.classList.remove("idle"); n.classList.toggle("good",lockOn);
  n.innerHTML=d.name.replace("#","♯")+'<sup>'+d.octave+'</sup>';
  $("solf").textContent=SOLF[lang][d.name];
  $("cents").textContent=(d.cents>0?"+":"")+d.cents; $("hz").textContent=freq.toFixed(1);
  setNeedle(d.cents,state);
  const g=$("guide"); g.className="guide";
  if(lockOn){ g.textContent=t("inTune"); g.classList.add("lock"); $("lock").classList.add("on"); }
  else if(d.cents<0){ g.textContent=t("up"); g.classList.add("up"); $("lock").classList.remove("on"); }
  else { g.textContent=t("down"); g.classList.add("down"); $("lock").classList.remove("on"); }
  // фиксация: держим строй ~0.45с -> «щелчок»
  const now=performance.now();
  if(lockOn){ if(!lockHoldStart) lockHoldStart=now; if(!confirmed && now-lockHoldStart>=450) doConfirm(); }
  else { lockHoldStart=0; if(confirmed) undoConfirm(); }
  if(targets.length){ let best=null,bd=1e9;
    targets.forEach(tg=>{ const diff=Math.abs(1200*Math.log2(freq/tg.freq)); if(diff<bd){bd=diff;best=tg;} });
    targets.forEach(tg=>{ if(!tg.el) return; tg.el.classList.toggle("active",tg===best); tg.el.classList.toggle("tuned",tg===best&&bd<=8); }); }
}
function softIdle(){ // сигнал пропал: держим ноту ~0.4с, потом гасим
  if(performance.now()-lastGood>400){ showIdle(); $("solf").textContent=t("wait"); $("guide").textContent="";
    $("lock").classList.remove("on"); lockOn=false; lockHoldStart=0; if(confirmed) undoConfirm(); setNeedle(0,"mut");
    document.querySelectorAll(".str").forEach(s=>s.classList.remove("active","tuned")); } }
function loop(){ if(!running) return;
  analyser.getByteFrequencyData(freqBuf); drawSpectrum();
  const now=performance.now();
  if(now-lastDetect>50){ lastDetect=now; analyser.getFloatTimeDomainData(timeBuf);
    const r=detectPitch(timeBuf,audioCtx.sampleRate);
    if(r.freq>0&&r.freq<2000&&r.clarity>0.86) updateDisplay(smoothFreq(r.freq),r.rms); else softIdle(); }
  rafId=requestAnimationFrame(loop);
}

/* ИНИЦИАЛИЗАЦИЯ */
buildA4presets(); setA4(440);
$("dronesel").innerHTML=noteOptions(23,88); $("dronesel").value="45";
if(!storageOk()) $("saveTuning").style.display="none";
applyHapticsUI();
curId="guitar"; applyLang(); selectBuiltin("guitar");
</script>
