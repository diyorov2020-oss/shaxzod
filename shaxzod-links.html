<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHAXZOD DIYOROV</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Rajdhani', sans-serif;
    overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,60,0,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,60,0,0.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 8s linear infinite;
    z-index: 0;
  }
  @keyframes gridMove {
    0% { transform: translateY(0); }
    100% { transform: translateY(40px); }
  }
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(255,60,0,0.15) 0%, transparent 70%);
    z-index: 0;
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
    50% { opacity: 1; transform: translateX(-50%) scale(1.1); }
  }
  .card {
    position: relative;
    z-index: 1;
    width: 340px;
    padding: 48px 32px 40px;
    text-align: center;
    border: 1px solid rgba(255,60,0,0.3);
    background: rgba(10,10,10,0.9);
    backdrop-filter: blur(20px);
    animation: fadeUp 0.8s ease both;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #ff3c00, transparent);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff3c00, #ff8c00);
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 32px;
    color: #fff;
    letter-spacing: 2px;
    box-shadow: 0 0 30px rgba(255,60,0,0.4);
    animation: fadeUp 0.8s 0.1s ease both;
  }
  .name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    letter-spacing: 4px;
    color: #fff;
    line-height: 1;
    animation: fadeUp 0.8s 0.2s ease both;
  }
  .title {
    font-size: 12px;
    letter-spacing: 2.5px;
    color: #ff3c00;
    text-transform: uppercase;
    margin-top: 8px;
    margin-bottom: 6px;
    animation: fadeUp 0.8s 0.25s ease both;
  }
  .licensed {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    margin-bottom: 32px;
    animation: fadeUp 0.8s 0.3s ease both;
  }
  .licensed::before, .licensed::after {
    content: '';
    width: 20px;
    height: 1px;
    background: rgba(255,255,255,0.2);
  }
  .links { display: flex; flex-direction: column; gap: 14px; }
  .btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.8s ease both;
  }
  .btn:nth-child(1) { animation-delay: 0.4s; }
  .btn:nth-child(2) { animation-delay: 0.5s; }
  .btn:nth-child(3) { animation-delay: 0.55s; }
  .btn:nth-child(4) { animation-delay: 0.6s; }
  .btn:nth-child(5) { animation-delay: 0.65s; }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,60,0,0.08), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s ease;
  }
  .btn:hover::before { transform: translateX(100%); }
  .btn:hover {
    border-color: #ff3c00;
    background: rgba(255,60,0,0.08);
    transform: translateX(4px);
    box-shadow: -4px 0 0 #ff3c00;
  }
  .btn-icon {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 22px; height: 22px; }
  .btn.yt .btn-icon svg { fill: #ff0000; }
  .btn.yt:hover { border-color: #ff0000; box-shadow: -4px 0 0 #ff0000; }
  .btn.ig .btn-icon svg { fill: url(#igGrad); }
  .btn.ig:hover { border-color: #c13584; box-shadow: -4px 0 0 #c13584; }
  .btn.ig2 .btn-icon svg { fill: url(#igGrad2); }
  .btn.ig2:hover { border-color: #8a3ab9; box-shadow: -4px 0 0 #8a3ab9; }
  .btn.ph .btn-icon svg { fill: #00e676; }
  .btn.ph:hover { border-color: #00e676; box-shadow: -4px 0 0 #00e676; }
  .btn-label { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; }
  .btn-sub {
    font-size: 9px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    font-weight: 400;
  }
  .divider {
    width: 40px; height: 1px;
    background: rgba(255,60,0,0.4);
    margin: 28px auto 0;
    animation: fadeUp 0.8s 0.7s ease both;
  }
  .city {
    margin-top: 16px;
    font-size: 11px;
    letter-spacing: 3px;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    animation: fadeUp 0.8s 0.8s ease both;
  }
</style>
</head>
