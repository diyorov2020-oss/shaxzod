<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Угадай мелодию 🎵</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c542;--bg:#070912;--panel:rgba(15,19,38,.95);--text:#eef1ff;--muted:#8b93b8;--green:#6ee77a;--red:#ff5d5d}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1000px 460px at 50% -8%,rgba(245,197,66,.08),transparent 60%),var(--bg);color:var(--text);font-family:'Russo One',-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
.hidden{display:none!important}
button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font:inherit;font-size:15px;color:var(--text)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d9a520);color:#1a1405;font-size:16px;letter-spacing:.5px}
.btn-ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16)}
#hud{position:fixed;top:14px;right:14px;display:flex;gap:8px;z-index:15}
#hud button{padding:9px 13px;font-size:17px;border-radius:10px}
.home{position:fixed;top:14px;left:14px;z-index:15;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:9px 13px;color:var(--gold);text-decoration:none;font-size:14px}

.wrap{max-width:1100px;margin:0 auto;padding:64px 18px 36px;text-align:center}
h1{color:var(--gold);font-weight:400;font-size:clamp(20px,3.4vw,32px);margin:0 0 18px;letter-spacing:1px}

/* таймер */
.timerWrap{position:relative;width:min(300px,68vw);aspect-ratio:1;margin:0 auto 12px}
svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:rgba(255,255,255,.08);stroke-width:12}
.ring .fg{fill:none;stroke:var(--green);stroke-width:12;stroke-linecap:round;transition:stroke .3s}
.timeText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(44px,12vw,80px);letter-spacing:1px}
.presets{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.presets button{padding:8px 14px;font-size:14px}
.presets button.active{background:var(--gold);color:#1a1405}
.tctrl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}

/* табло */
#board{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));max-width:900px;margin:0 auto}
.team{background:linear-gradient(160deg,#141a33,#0e1326);border:2px solid rgba(255,255,255,.1);border-radius:18px;padding:16px 14px;transition:border-color .3s,box-shadow .3s}
.team.lead{border-color:var(--gold);box-shadow:0 0 26px rgba(245,197,66,.25)}
.team .nm{font-family:system-ui;font-size:17px;font-weight:600;color:var(--text);outline:none;margin-bottom:8px;word-break:break-word}
.team .nm:focus{color:var(--gold)}
.team .sc{font-size:clamp(40px,9vw,64px);color:var(--gold);line-height:1;margin:6px 0 12px;transition:transform .12s}
.team .sc.bump{transform:scale(1.18)}
.team .pm{display:flex;gap:8px;justify-content:center}
.team .pm button{width:46px;height:46px;padding:0;font-size:22px;border-radius:12px}
.team .key{font-family:system-ui;font-size:11px;color:var(--muted);margin-top:8px}
.addbar{margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tag{font-family:system-ui;font-size:13px;color:var(--muted);margin-top:18px}
</style>
</head>
<body>
<a class="home" href="pult.html">⌂ ПУЛЬТ</a>
<div id="hud">
  <button class="btn-ghost" id="btnSnd" title="Звуки">🔊</button>
  <button class="btn-ghost" id="btnFs" title="Весь экран (F)">⛶</button>
</div>

<div class="wrap">
  <h1>🎵 УГАДАЙ МЕЛОДИЮ</h1>

  <div class="timerWrap">
    <svg class="ring" viewBox="0 0 120 120">
      <circle class="bg" cx="60" cy="60" r="52"></circle>
      <circle class="fg" id="ringFg" cx="60" cy="60" r="52"></circle>
    </svg>
    <div class="timeText" id="timeText">0:30</div>
  </div>
  <div class="presets" id="presets">
    <button data-s="15">15 сек</button>
    <button data-s="30" class="active">30 сек</button>
    <button data-s="60">1 мин</button>
    <button data-s="90">1:30</button>
  </div>
  <div class="tctrl">
    <button class="btn-gold" id="btnStart">▶ СТАРТ</button>
    <button class="btn-ghost" id="btnReset">↻ Сброс</button>
  </div>

  <div id="board"></div>
  <div class="addbar">
    <button class="btn-ghost" id="btnAdd">＋ Команда</button>
    <button class="btn-ghost" id="btnDel">－ Команда</button>
    <button class="btn-ghost" id="btnZero">Обнулить счёт</button>
  </div>
  <div class="tag">Space — старт/пауза таймера · 1–4 — очко команде · R — сброс таймера · имена меняются кликом</div>
</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
let sndOn=true;

/* ===== звук ===== */
let audioCtx=null;
function beep(f,d,type,g){
  if(!sndOn)return;
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')audioCtx.resume();
    const o=audioCtx.createOscillator(),gn=audioCtx.createGain();
    o.type=type||'sine';o.frequency.value=f;
    gn.gain.setValueAtTime(g||0.12,audioCtx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+d);
    o.connect(gn);gn.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d+0.02);}catch(e){}
}
function endSound(){[784,659,523].forEach((f,i)=>setTimeout(()=>beep(f,.25,'triangle',.2),i*180));}
function pointSound(){beep(880,.08,'square',.16);setTimeout(()=>beep(1320,.1,'square',.14),70);}

/* ===== таймер ===== */
const R=52,CIRC=2*Math.PI*R;
$('ringFg').style.strokeDasharray=CIRC;
let total=30,remain=30,running=false,lastTick=0,tickedAt=-1;

function fmt(s){const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+String(ss).padStart(2,'0');}
function renderTimer(){
  $('timeText').textContent=fmt(Math.ceil(remain));
  const frac=total>0?remain/total:0;
  $('ringFg').style.strokeDashoffset=CIRC*(1-frac);
  const fg=$('ringFg');
  fg.style.stroke = remain<=5 ? 'var(--red)' : remain<=10 ? 'var(--gold)' : 'var(--green)';
  $('timeText').style.color = remain<=5 ? 'var(--red)' : 'var(--text)';
}
function setTotal(s){total=s;remain=s;running=false;tickedAt=-1;$('btnStart').textContent='▶ СТАРТ';renderTimer();}
function startPause(){
  if(remain<=0){remain=total;}
  running=!running;
  $('btnStart').textContent=running?'⏸ ПАУЗА':'▶ СТАРТ';
  if(running){lastTick=performance.now();requestAnimationFrame(tick);beep(523,.1,'sine',.12);}
}
function resetTimer(){running=false;remain=total;tickedAt=-1;$('btnStart').textContent='▶ СТАРТ';renderTimer();}
function tick(now){
  if(!running)return;
  const dt=(now-lastTick)/1000;lastTick=now;
  remain=Math.max(0,remain-dt);
  const whole=Math.ceil(remain);
  if(remain<=10 && remain>0 && whole!==tickedAt){tickedAt=whole;beep(whole<=5?900:700,.05,'square',.12);}
  renderTimer();
  if(remain<=0){running=false;$('btnStart').textContent='▶ СТАРТ';endSound();
    document.body.animate([{background:'rgba(245,197,66,.12)'},{background:'transparent'}],{duration:600});
    return;}
  requestAnimationFrame(tick);
}

/* ===== табло ===== */
let teams=[{name:'Команда 1',score:0},{name:'Команда 2',score:0}];
function renderBoard(){
  const b=$('board');b.innerHTML='';
  const max=Math.max(...teams.map(t=>t.score),0);
  teams.forEach((t,i)=>{
    const lead=t.score===max && max>0;
    const d=document.createElement('div');
    d.className='team'+(lead?' lead':'');
    d.innerHTML=
      '<div class="nm" contenteditable="true" spellcheck="false" data-i="'+i+'">'+esc(t.name)+'</div>'+
      '<div class="sc" id="sc'+i+'">'+t.score+'</div>'+
      '<div class="pm"><button data-m="-1" data-i="'+i+'">−</button><button data-m="1" data-i="'+i+'">＋</button></div>'+
      (i<4?'<div class="key">клавиша '+(i+1)+'</div>':'');
    b.appendChild(d);
  });
  // обработчики имён
  b.querySelectorAll('.nm').forEach(el=>{
    el.addEventListener('input',()=>{teams[+el.dataset.i].name=el.textContent;});
    el.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();el.blur();}});
  });
  b.querySelectorAll('.pm button').forEach(btn=>{
    btn.onclick=()=>addScore(+btn.dataset.i,+btn.dataset.m);
  });
}
function addScore(i,d){
  if(i<0||i>=teams.length)return;
  teams[i].score=Math.max(0,teams[i].score+d);
  const sc=$('sc'+i);
  if(sc){sc.textContent=teams[i].score;
    if(d>0){sc.classList.add('bump');setTimeout(()=>sc.classList.remove('bump'),130);pointSound();}
    else beep(300,.08,'sine',.1);}
  // пересчёт лидера
  const max=Math.max(...teams.map(t=>t.score),0);
  document.querySelectorAll('.team').forEach((el,idx)=>{
    el.classList.toggle('lead',teams[idx].score===max&&max>0);
  });
}
function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

/* ===== управление ===== */
$('presets').querySelectorAll('button').forEach(btn=>{
  btn.onclick=()=>{
    $('presets').querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');setTotal(+btn.dataset.s);
  };
});
$('btnStart').onclick=startPause;
$('btnReset').onclick=resetTimer;
$('btnAdd').onclick=()=>{if(teams.length<6){teams.push({name:'Команда '+(teams.length+1),score:0});renderBoard();}};
$('btnDel').onclick=()=>{if(teams.length>1){teams.pop();renderBoard();}};
$('btnZero').onclick=()=>{teams.forEach(t=>t.score=0);renderBoard();};
$('btnSnd').onclick=()=>{sndOn=!sndOn;$('btnSnd').textContent=sndOn?'🔊':'🔇';};
$('btnFs').onclick=toggleFs;
function toggleFs(){if(document.fullscreenElement)document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});}

addEventListener('keydown',e=>{
  if(e.target.isContentEditable)return; // не мешать редактированию имён
  if(e.code==='Space'){e.preventDefault();startPause();}
  else if(e.key>='1'&&e.key<='4'){addScore(+e.key-1,1);}
  else if(e.key==='r'||e.key==='R'||e.key==='к'||e.key==='К'){resetTimer();}
  else if(e.key==='f'||e.key==='F'||e.key==='а'||e.key==='А')toggleFs();
});

setTotal(30);renderBoard();
</script>
</body>
</html>
